server:
    port: 8081


spring:
    application:
        name: user-service

    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/my_budget_buddy}
        username: ${DATABASE_USER:postgres}
        password: ${DATABASE_PASS}

    output:
        ansi:
            enabled: ALWAYS

    jpa:
        hibernate:
            ddl-auto: update


eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://host.docker.internal:8761/eureka}

    
    instance:
        leaseRenewalIntervalInSeconds: 30
        hostname: ${AWS_HOSTNAME:localhost}
